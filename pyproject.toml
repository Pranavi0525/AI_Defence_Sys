[project]
name = "red-team-ai"
version = "0.1.0"
description = "Module 1: Red Team AI — Synthetic payment-fraud attack trace generation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "networkx>=3.0,<4",
    "fastapi>=0.136,<1",
    "uvicorn>=0.46,<1",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<1",
    "python-dotenv>=1.2,<2",
    "google-genai>=2.7,<3",
    "xgboost>=3.4,<3.5",
    "joblib>=1.5,<2",
    "shap>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
]

[build-system]
requires = ["setuptools>=79.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]